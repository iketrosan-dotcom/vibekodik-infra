global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates.tmpl'

route:
  receiver: telegram
  group_by: ['alertname', 'host']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers: [ severity="critical" ]
      receiver: telegram
      group_wait: 0s
      repeat_interval: 30m

receivers:
  - name: telegram
    telegram_configs:
      # Placeholder. Кристиан подменяет на реальные значения после @BotFather.
      # После замены: `docker compose -f /opt/monitor/docker-compose.yml restart alertmanager`.
      - bot_token: 'REPLACE_ME_BOTFATHER_TOKEN'
        chat_id: 1
        parse_mode: HTML
        message: '{{ template "telegram.message" . }}'
        send_resolved: true

inhibit_rules:
  - source_matchers: [ severity="critical" ]
    target_matchers: [ severity="warning" ]
    equal: ['alertname', 'host']
