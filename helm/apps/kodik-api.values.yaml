# Kodik IDE API (FastAPI, монорепо mike2505/Kodik-API). Namespace: kodik-ide.
# Мигрировано с Selectel ryleigh+mariela (2× VM 4vCPU/32GB, uvicorn --workers 4) 2026-07-06.
#
# Секреты: Vault kv/apps/kodik-api (~60 ключей: живой .env с ryleigh + overrides:
# DATABASE_URL→MDB kodik-ide-pg, REDIS_HOST→kodik-redis, ENABLE_AUTO_RENEWAL=false
# до cutover — иначе APScheduler на копии БД начнёт реальные списания YooKassa/Stripe).
#
# ВАЖНО (cutover): renewal-scheduler запускается В КАЖДОМ поде (in-process APScheduler,
# app/main.py startup). До включения ENABLE_AUTO_RENEWAL в k8s нужен либо выделенный
# single-replica worker, либо оставить как на VM (там тоже 2 хоста × 4 воркера — есть
# защита на уровне приложения, проверить с Димой).

image:
  repository: cr.yandex/crp7738saq8ngg8ad5tm/kodik-api
  tag: dev-925ebb5 # мёрж Димы 2026-07-07 16:54 (вчерашний фикс) — пересборка после cutover
  pullPolicy: IfNotPresent
# 2 реплики на cutover (HA). Свободные ноды по requests есть (13-46%).
replicaCount: 2
containerPort: 8000
args:
- uvicorn
- app.main:app
- --host=0.0.0.0
- --port=8000
- --workers=4
env:
  # ⚠️ Веса анонимайзера в образе = 135-байтный git-LFS-указатель (real blob не тянулся с
  # ryleigh). Реальный DeBERTa (4.9G) лежит в S3 (s3://kodik/Kodik-API/models/...) —
  # тянем его initContainer'ом в /weights и переопределяем путь. from_pretrained (hybrid_detector.py:65)
  # читает абсолютный путь. Иначе анонимайзер падал бы при первом вызове (грузится лениво).
  ANONYMIZER_MODEL_PATH: /weights/kodik-detector-epoch4-f1-89
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
resources:
  requests:
    # prod-sizing на cutover. CPU-лимита нет → torch/anonymizer бёрстят выше request.
    cpu: "1"
    memory: 4Gi
  limits:
    memory: 10Gi
probes:
  enabled: true
  # /healthz — лёгкий (без внешних зависимостей). НЕ /health: тот дёргает
  # DB/S3/OpenRouter/PayKeeper и может флапать liveness из-за чужих аутэйджей.
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 15
  startup:
    enabled: true
    failureThreshold: 24 # 24×5s = 120с на torch import + 4 воркера
    periodSeconds: 5
podDisruptionBudget:
  enabled: true
  minAvailable: 1
ingress:
  enabled: true
  host: api.vibekodik.ru
  # Алиасы api.kodik.ru/api.aikodik.ru временно убраны из SAN: их HTTP-01 challenge отдавал
  # 503 и блокировал мульти-SAN серт основного хоста. Вернуть после стабилизации cutover.
  # extraHosts:
  #   - api.kodik.ru
  #   - api.aikodik.ru
  tlsSecretName: api-vibekodik-ru-tls
  clusterIssuer: letsencrypt-prod
  annotations:
    # 1g покрывает app-лимит marketplace-media (video 500MB hard-cap). Аннотация nginx-ingress
    # применяется ко всему хосту api.vibekodik.ru (per-path скоуп невозможен одним Ingress).
    nginx.ingress.kubernetes.io/proxy-body-size: "1g"
    # IDE-чат стримит ответы LLM (SSE) — как у kodikrouter-api.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Retry только до первого байта (connect/reset) — биллинг-безопасно, см. kodikrouter-api.
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error non_idempotent"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "5"
# Веса анонимайзера из S3 (тот же приём, что kodikrouter-api/kodik-embedding). S3-кредов
# в секрете kodik-api НЕТ (в .env их не было) → берём из соседнего kodik-embedding-env
# (та же ns, тот же бакет "kodik"). verify=False — Selectel S3 отдаёт Russian Trusted CA.
initContainers:
  - name: fetch-ml-weights
    image: cr.yandex/crp7738saq8ngg8ad5tm/kodik-api:latest
    imagePullPolicy: IfNotPresent
    command: ["python", "-c"]
    args:
      - |
        import os, boto3, urllib3
        urllib3.disable_warnings()
        s3 = boto3.client("s3",
            endpoint_url="https://" + os.environ["S3_ENDPOINT"].replace("https://", ""),
            aws_access_key_id=os.environ["S3_ACCESS_KEY"],
            aws_secret_access_key=os.environ["S3_SECRET_KEY"],
            region_name=os.environ.get("S3_REGION", "ru-1"), verify=False)
        b = os.environ["S3_BUCKET"]; pfx = "Kodik-API/models/"
        pag = s3.get_paginator("list_objects_v2"); n = 0
        for page in pag.paginate(Bucket=b, Prefix=pfx):
            for o in page.get("Contents", []):
                dst = os.path.join("/weights", o["Key"][len(pfx):])
                os.makedirs(os.path.dirname(dst), exist_ok=True)
                s3.download_file(b, o["Key"], dst); n += 1
        print("downloaded", n, "files:", sorted(os.listdir("/weights")))
    env:
      - name: S3_ENDPOINT
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_ENDPOINT } }
      - name: S3_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_ACCESS_KEY } }
      - name: S3_SECRET_KEY
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_SECRET_KEY } }
      - name: S3_REGION
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_REGION } }
      - name: S3_BUCKET
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_BUCKET } }
    volumeMounts:
      - { name: ml-weights, mountPath: /weights }
volumes:
  - name: ml-weights
    emptyDir:
      sizeLimit: 8Gi
volumeMounts:
  - { name: ml-weights, mountPath: /weights, readOnly: true }
externalSecret:
  enabled: true
  storeName: vault-kv
  storeKind: ClusterSecretStore
  remoteKey: apps/kodik-api
serviceAccount:
  create: true
