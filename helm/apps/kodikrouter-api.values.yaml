# KodikRouter API (FastAPI). Namespace: kodikrouter.
#   helm upgrade --install kodikrouter-api ./charts/app -n kodikrouter -f kodikrouter-api.values.yaml \
#     --set image.repository=cr.yandex/<registry-id>/kodikrouter-api --set image.tag=<sha>
#
# Секреты: Vault KV path kodik/kodikrouter-api (52 env-ключа: DB_*/JWT/OpenRouter/OAuth/
# YooKassa/Stripe/S3_*/SMTP/PROXY_*/TELEGRAM_*). Заливаются туда отдельно (vault kv put).
#
# Источники архитектурных решений: k8s-apps-migration-architecture.md §1.1, §2.5, §2.6.

image:
  repository: cr.yandex/crp7738saq8ngg8ad5tm/kodikrouter-api
  tag: dev-67467e3 # управляется ArgoCD Image Updater
  pullPolicy: Always # временно: итерируем образ под тем же тегом (вернуть IfNotPresent после стабилизации)

replicaCount: 2
containerPort: 8000

# --- КРИТИЧНО (live-аудит 2026-06-03 + память dima-memory-tuning/masking-bottleneck) ---
# workers=1: на cold-load DeBERTa-анонимайзера workers=2 ловит race и тихо падает.
# limit-max-requests: периодический recycle воркера сбрасывает залипший event-loop.
# limit-concurrency: бэкпрешер. Restart=always обеспечивается Deployment по умолчанию.
args:
  - uvicorn
  - app.main:app
  - --host=0.0.0.0
  - --port=8000
  - --workers=1
  - --limit-max-requests=5000
  - --limit-concurrency=64

env:
  # glibc arena/trim tuning против RSS-фрагментации (Dima's tuning, все 4 как в systemd).
  MALLOC_ARENA_MAX: "2"
  MALLOC_TRIM_THRESHOLD_: "131072"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  # base64-картинки/файлы в запросе (см. память kodikrouter-max-request-body).
  # 100 МБ: держим файлы до ~50 МБ (base64 ≈ +33% → ~67 МБ) + история. Должно быть
  # >= ingress proxy-body-size и >= DO-proxy client_max_body_size (оба 100m).
  MAX_REQUEST_BODY_BYTES: "104857600"
  # ML-веса берём из примонтированного /weights (см. initContainers), абсолютные пути.
  # Код чтит absolute path (service.py:_resolve_single_model_path).
  ANONYMIZER_MODEL_PATH: /weights/kodik-detector-epoch4-f1-89
  ANONYMIZER_GLINER_MODEL: /weights/gliner-medium-v2.1

# Выделенная NG — taint dedicated=kodikrouter-api:NoSchedule.
nodeSelector:
  workload: kodikrouter-api
tolerations:
  - key: dedicated
    operator: Equal
    value: kodikrouter-api
    effect: NoSchedule

# RSS в покое (workers=1) ~3.2 GB по live-замеру → 4Gi = OOM. Держим как systemd MemoryMax=12G.
# DeBERTa жрёт реальный CPU (не burst) → requests.cpu высокий, чтобы scheduler не паковал плотно.
resources:
  requests:
    cpu: "4"
    memory: 6Gi
  limits:
    cpu: "8"
    memory: 12Gi

# ML грузится на старте ~30-60с → startupProbe держит, пока не поднимется; потом liveness.
probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 15
  startup:
    enabled: true
    failureThreshold: 40 # 40×5s = 200с бюджет на cold ML-load
    periodSeconds: 5

# initContainer тянет ML-веса (2.4 GB .zip) из Selectel S3 → распаковывает в /weights.
# Веса на S3: s3://kodik/KodikRouter/anonymizer/*.zip (распаковка даёт kodik-detector-epoch4-f1-89/
# + gliner-medium-v2.1/). Используем образ api (там boto3+python); verify=False — Selectel
# отдаёт цепочку с Russian Trusted CA, которой нет в CA-бандле. download_file стримит на диск
# (не грузим 1.4GB zip в RAM). S3-креды/endpoint — из ESO-секрета kodikrouter-api-env.
initContainers:
  - name: fetch-ml-weights
    image: cr.yandex/crp7738saq8ngg8ad5tm/kodikrouter-api:latest
    imagePullPolicy: Always
    command: ["python", "-c"]
    args:
      - |
        import os, boto3, zipfile, urllib3
        urllib3.disable_warnings()
        s3 = boto3.client("s3",
            endpoint_url="https://" + os.environ["S3_ENDPOINT"],
            aws_access_key_id=os.environ["S3_ACCESS_KEY"],
            aws_secret_access_key=os.environ["S3_SECRET_KEY"],
            region_name=os.environ.get("S3_REGION", "ru-3"), verify=False)
        b = os.environ["S3_BUCKET"]; pfx = "KodikRouter/anonymizer/"
        objs = s3.list_objects_v2(Bucket=b, Prefix=pfx).get("Contents", [])
        zips = [o["Key"] for o in objs if o["Key"].endswith(".zip")]
        print("zips:", zips)
        for k in zips:
            tmp = "/weights/_dl.zip"
            print("downloading", k)
            s3.download_file(b, k, tmp)
            zipfile.ZipFile(tmp).extractall("/weights")
            os.remove(tmp)
        print("weights:", sorted(os.listdir("/weights")))
    env:
      - name: S3_ENDPOINT
        valueFrom: { secretKeyRef: { name: kodikrouter-api-env, key: S3_ENDPOINT } }
      - name: S3_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: kodikrouter-api-env, key: S3_ACCESS_KEY } }
      - name: S3_SECRET_KEY
        valueFrom: { secretKeyRef: { name: kodikrouter-api-env, key: S3_SECRET_KEY } }
      - name: S3_REGION
        valueFrom: { secretKeyRef: { name: kodikrouter-api-env, key: S3_REGION } }
      - name: S3_BUCKET
        valueFrom: { secretKeyRef: { name: kodikrouter-api-env, key: S3_BUCKET } }
    volumeMounts:
      - { name: ml-weights, mountPath: /weights }

volumes:
  - name: ml-weights
    emptyDir:
      sizeLimit: 6Gi
volumeMounts:
  - { name: ml-weights, mountPath: /weights, readOnly: true }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  host: api.kodikrouter.ru
  tlsSecretName: api-kodikrouter-ru-tls
  clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m" # файлы до ~50 МБ (base64 +33%)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # SSE/streaming LLM
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

externalSecret:
  enabled: true
  storeName: vault-kv
  storeKind: ClusterSecretStore
  remoteKey: apps/kodikrouter-api # Vault KV: kv/data/apps/kodikrouter-api

serviceAccount:
  create: true
