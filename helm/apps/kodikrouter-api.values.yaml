# KodikRouter API (FastAPI). Namespace: kodikrouter.
#   helm upgrade --install kodikrouter-api ./charts/app -n kodikrouter -f kodikrouter-api.values.yaml \
#     --set image.repository=cr.yandex/<registry-id>/kodikrouter-api --set image.tag=<sha>
#
# Секреты: Vault KV path kodik/kodikrouter-api (52 env-ключа: DB_*/JWT/OpenRouter/OAuth/
# YooKassa/Stripe/S3_*/SMTP/PROXY_*/TELEGRAM_*). Заливаются туда отдельно (vault kv put).
#
# Источники архитектурных решений: k8s-apps-migration-architecture.md §1.1, §2.5, §2.6.

image:
  repository: cr.yandex/__REGISTRY_ID__/kodikrouter-api
  tag: latest

replicaCount: 2
containerPort: 8000

# --- КРИТИЧНО (live-аудит 2026-06-03 + память dima-memory-tuning/masking-bottleneck) ---
# workers=1: на cold-load DeBERTa-анонимайзера workers=2 ловит race и тихо падает.
# limit-max-requests: периодический recycle воркера сбрасывает залипший event-loop.
# limit-concurrency: бэкпрешер. Restart=always обеспечивается Deployment по умолчанию.
args:
  - uvicorn
  - app.main:app
  - --host=0.0.0.0
  - --port=8000
  - --workers=1
  - --limit-max-requests=5000
  - --limit-concurrency=64

env:
  # glibc arena/trim tuning против RSS-фрагментации (Dima's tuning, все 4 как в systemd).
  MALLOC_ARENA_MAX: "2"
  MALLOC_TRIM_THRESHOLD_: "131072"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  # base64-картинки в истории чата (см. память kodikrouter-max-request-body).
  MAX_REQUEST_BODY_BYTES: "33554432"
  # ML-веса берём из примонтированного /weights (см. initContainers), абсолютные пути.
  # Код чтит absolute path (service.py:_resolve_single_model_path).
  ANONYMIZER_MODEL_PATH: /weights/kodik-detector-epoch4-f1-89
  ANONYMIZER_GLINER_MODEL: /weights/gliner-medium-v2.1

# Выделенная NG — taint dedicated=kodikrouter-api:NoSchedule.
nodeSelector:
  workload: kodikrouter-api
tolerations:
  - key: dedicated
    operator: Equal
    value: kodikrouter-api
    effect: NoSchedule

# RSS в покое (workers=1) ~3.2 GB по live-замеру → 4Gi = OOM. Держим как systemd MemoryMax=12G.
# DeBERTa жрёт реальный CPU (не burst) → requests.cpu высокий, чтобы scheduler не паковал плотно.
resources:
  requests:
    cpu: "4"
    memory: 6Gi
  limits:
    cpu: "8"
    memory: 12Gi

# ML грузится на старте ~30-60с → startupProbe держит, пока не поднимется; потом liveness.
probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 15
  startup:
    enabled: true
    failureThreshold: 40 # 40×5s = 200с бюджет на cold ML-load
    periodSeconds: 5

# initContainer тянет ML-веса (2.4 GB) из Selectel S3 в emptyDir перед стартом.
# S3-креды — из того же ESO-секрета kodikrouter-api-env (ключи S3_ACCESS_KEY/S3_SECRET_KEY).
initContainers:
  - name: fetch-ml-weights
    image: amazon/aws-cli:2.17.0
    command: ["sh", "-c"]
    args:
      - |
        aws --endpoint-url "$S3_ENDPOINT_URL" s3 sync "s3://$S3_BUCKET/anonymizer/" /weights/ --only-show-errors && \
        echo "weights synced:" && ls -1 /weights
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom: { secretKeyRef: { name: kodikrouter-api-env, key: S3_ACCESS_KEY } }
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: kodikrouter-api-env, key: S3_SECRET_KEY } }
      - name: S3_ENDPOINT_URL
        value: https://s3.ru-3.storage.selcloud.ru
      - name: S3_BUCKET
        value: kodik
    volumeMounts:
      - { name: ml-weights, mountPath: /weights }

volumes:
  - name: ml-weights
    emptyDir:
      sizeLimit: 4Gi
volumeMounts:
  - { name: ml-weights, mountPath: /weights, readOnly: true }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  host: api.kodikrouter.ru
  tlsSecretName: api-kodikrouter-ru-tls
  clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # SSE/streaming LLM
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

externalSecret:
  enabled: true
  storeName: vault-kv
  storeKind: ClusterSecretStore
  remoteKey: apps/kodikrouter-api # Vault KV: kv/data/apps/kodikrouter-api

serviceAccount:
  create: true
