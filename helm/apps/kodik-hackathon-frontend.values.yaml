# hackathon-frontend (Next.js 15). ns hackathon. Ingress hackathon.kodik.ru.
# /api/* маршрутизируется ingress'ом ПРЯМО на hackathon-backend (см. ingress.extraPaths).
# next.config-rewrite на API_TARGET НЕ работает в k8s: Next запекает rewrites в
# routes-manifest.json на build-time (там API_TARGET не задан → дефолт localhost:8000),
# рантайм-env уже не применяется. API_TARGET оставлен только для dev/совместимости.
image:
  repository: cr.yandex/crp7738saq8ngg8ad5tm/hackathon-frontend
  tag: dev-854c675
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: 3000

env:
  API_TARGET: http://hackathon-backend:8000 # Service бэкенда в ns hackathon

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }

probes:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 10

ingress:
  enabled: true
  host: hackathon.kodik.ru
  tlsSecretName: hackathon-kodik-ru-tls
  clusterIssuer: letsencrypt-prod
  # /api/* идёт прямо на backend-Service (longest-prefix в ingress-nginx),
  # / — на этот frontend. Один host, один TLS-серт.
  extraPaths:
    - path: /api
      pathType: Prefix
      serviceName: hackathon-backend
      servicePort: 8000

serviceAccount:
  create: true
