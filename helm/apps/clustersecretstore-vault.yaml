# ClusterSecretStore — мост ESO → Vault KV v2. Для секретов ПРИЛОЖЕНИЙ.
# (Lockbox-store yc-lockbox остаётся для bootstrap инфры: keycloak/vault creds.)
#
# Аутентификация: ESO под своим SA (external-secrets/external-secrets) логинится
# в Vault kubernetes-auth (роль external-secrets → политика app-reader, read kv/data/apps/*).
# Сами поды приложений в Vault НЕ ходят — секрет тянет ESO и кладёт в k8s Secret <svc>-env.
#
# Внутрикластерно Vault на HTTP (values-vault.yaml: global.tlsDisable=true). TLS — только
# на ingress vault.kodik.ru. Поэтому server=http и caProvider не нужен.
#
# ПРЕДУСЛОВИЕ: в Vault настроены kv/, политика app-reader, k8s-auth роль external-secrets
# (скрипт vault-eso-setup.sh).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-kv
spec:
  provider:
    vault:
      server: "http://vault-active.vault.svc.cluster.local:8200"
      path: "kv"        # KV-mount (тот же, что в configure-vault.sh)
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
