# Kodik+ ml-сервис (AI-ассистент: requirements/artifacts/team/roadmap/transcribe).
# FastAPI, порт 8000, health /ml/health. ns kodikplus. Внутренний (без ingress) —
# зовётся backend'ом по http://kodikplus-ml:8000.
#
# LLM через KodikRouter (LLM_PROVIDER=kodikrouter, Ollama НЕ нужен). Презентации —
# Gamma. STT — Whisper (base, cpu). Vector DB — Chroma на PVC. Промпты тянет из
# backend (ML_SERVICE_URL=http://kodikplus-backend:8000 + PROMPTS_API_SECRET).
# Секреты: Vault kv/apps/kodikplus-ml. Образ тяжёлый (torch/transformers/whisper).
#
# Модели (whisper base + e5-small embedding) грузятся ЛЕНИВО при первом запросе,
# на старте нет — поэтому быстрый старт. /ml/health возвращает 200 всегда (внутри
# проверяет ollama → ошибка ловится, HTTP 200) — для пробы достаточно.
image:
  repository: cr.yandex/crp7738saq8ngg8ad5tm/kodikplus-ml
  tag: dev-1ba8b1a # управляется ArgoCD Image Updater (newest-build dev-<sha>)
  pullPolicy: IfNotPresent

replicaCount: 1 # chroma = локальный файловый стор на RWO PVC
containerPort: 8000
service:
  port: 8000 # backend обращается http://kodikplus-ml:8000

resources:
  requests: { cpu: 500m, memory: 1536Mi }
  limits: { cpu: "3", memory: 6Gi }

probes:
  enabled: true
  path: /ml/health
  initialDelaySeconds: 25
  periodSeconds: 15

volumes:
  - name: chroma
    persistentVolumeClaim:
      claimName: kodikplus-ml-chroma
  - name: storage
    emptyDir: { sizeLimit: 2Gi }
volumeMounts:
  - { name: chroma, mountPath: /app/data }
  - { name: storage, mountPath: /app/storage }

externalSecret:
  enabled: true
  storeName: vault-kv
  storeKind: ClusterSecretStore
  remoteKey: apps/kodikplus-ml

serviceAccount:
  create: true
