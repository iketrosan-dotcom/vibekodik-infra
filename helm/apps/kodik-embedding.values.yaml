# Kodik Embedding & Anonymizer (FastAPI, монорепо Kodik-API/embedding/). Namespace: kodik-ide.
# Мигрировано с Selectel susanne#1 (2vCPU/8GB, uvicorn --workers 4) 2026-07-06.
#
# Секреты: Vault kv/apps/kodik-embedding (живой .env с susanne: SECRET_KEY/OPENROUTER/
# NOVITA/S3_*/SENTRY + ANONYMIZER_*). ANONYMIZER_MODEL_PATH переопределён на /weights.
#
# Публичного ingress НЕТ: на Selectel сервис жил за LB-пулом; в k8s его зовёт kodik-api
# по svc-DNS (kodik-embedding.kodik-ide.svc:8000). Если перед cutover выяснится публичный
# hostname (см. L7-политики Selectel LB) — добавить ingress тут.

image:
  repository: cr.yandex/crp7738saq8ngg8ad5tm/kodik-embedding
  tag: dev-da81d9a
  pullPolicy: IfNotPresent
replicaCount: 1
containerPort: 8000
args:
- uvicorn
- app.main:app
- --host=0.0.0.0
- --port=8000
- --workers=4
env:
  ANONYMIZER_MODEL_PATH: /weights/kodik-detector-epoch4-f1-89
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  MALLOC_ARENA_MAX: "2"
resources:
  requests:
    # 100m: node-группа на максимуме, ноды забиты requests'ами соседей (по факту простой 1-7%).
    # CPU-лимита нет → DeBERTa бёрстит свободно. Вернуть ~2 на cutover.
    cpu: "100m"
    memory: 6Gi
  limits:
    memory: 10Gi
probes:
  enabled: true
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 15
  startup:
    enabled: true
    failureThreshold: 60 # 60×5s = 300с: cold-load DeBERTa 4.9GB с emptyDir
    periodSeconds: 5
# Веса 5.22GB лежат ПОФАЙЛОВО в s3://kodik/Kodik-API/models/kodik-detector-epoch4-f1-89/
# (НЕ zip — иначе x2 место в emptyDir). Качаем прямо в /weights. verify=False — Selectel
# отдаёт Russian Trusted CA (см. kodikrouter-api). Креды из ESO-секрета kodik-embedding-env.
initContainers:
  - name: fetch-ml-weights
    image: cr.yandex/crp7738saq8ngg8ad5tm/kodik-embedding:latest
    imagePullPolicy: Always
    command: ["python", "-c"]
    args:
      - |
        import os, boto3, urllib3
        urllib3.disable_warnings()
        s3 = boto3.client("s3",
            endpoint_url="https://" + os.environ["S3_ENDPOINT"].replace("https://", ""),
            aws_access_key_id=os.environ["S3_ACCESS_KEY"],
            aws_secret_access_key=os.environ["S3_SECRET_KEY"],
            region_name=os.environ.get("S3_REGION", "ru-1"), verify=False)
        b = os.environ["S3_BUCKET"]; pfx = "Kodik-API/models/"
        pag = s3.get_paginator("list_objects_v2")
        n = 0
        for page in pag.paginate(Bucket=b, Prefix=pfx):
            for o in page.get("Contents", []):
                rel = o["Key"][len(pfx):]
                dst = os.path.join("/weights", rel)
                os.makedirs(os.path.dirname(dst), exist_ok=True)
                s3.download_file(b, o["Key"], dst)
                n += 1
        print("downloaded", n, "files:", sorted(os.listdir("/weights")))
    env:
      - name: S3_ENDPOINT
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_ENDPOINT } }
      - name: S3_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_ACCESS_KEY } }
      - name: S3_SECRET_KEY
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_SECRET_KEY } }
      - name: S3_REGION
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_REGION } }
      - name: S3_BUCKET
        valueFrom: { secretKeyRef: { name: kodik-embedding-env, key: S3_BUCKET } }
    volumeMounts:
      - { name: ml-weights, mountPath: /weights }
volumes:
  - name: ml-weights
    emptyDir:
      sizeLimit: 8Gi
volumeMounts:
  - { name: ml-weights, mountPath: /weights, readOnly: true }
ingress:
  enabled: false
externalSecret:
  enabled: true
  storeName: vault-kv
  storeKind: ClusterSecretStore
  remoteKey: apps/kodik-embedding
serviceAccount:
  create: true
