{{- if .Values.externalSecret.enabled }}
{{- $remoteKey := .Values.externalSecret.remoteKey | default .Values.externalSecret.lockboxSecretId -}}
{{- if not $remoteKey }}{{ fail "externalSecret.enabled=true требует externalSecret.remoteKey (Vault KV path) или legacy lockboxSecretId" }}{{- end }}
# Тянет ВЕСЬ payload секрета (Vault KV или Lockbox) в k8s Secret <fullname>-env.
# extract.key = путь в сторе; все ключи payload'а → ключи Secret'а, грузятся через envFrom.
# Имена ключей в сторе = имена env-переменных приложения.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}-env
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: {{ include "app.fullname" . }}-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $remoteKey | quote }}
{{- end }}
