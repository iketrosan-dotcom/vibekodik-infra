# KodikShield demo (ЛОКО-Банк) — anonymizer (FastAPI :8020). ns kodikdemo. Internal-only.
# Гибридный детектор: regex+checksum+словарь всегда; DeBERTa+GLiNER (WITH_ML=1 в образе,
# ANONYMIZER_ML_ENABLED default true) — веса из S3 через initContainer (паттерн kodikrouter-api).
image:
  repository: cr.yandex/crp7738saq8ngg8ad5tm/kodikdemo-anonymizer
  tag: dev-ee276f2 # содержимое = commit 7ccff75 (CPU-torch fix собран до коммита)
  pullPolicy: IfNotPresent
replicaCount: 1
containerPort: 8020
env:
  ANONYMIZER_MODEL_PATH: /models/kodik-detector-epoch4-f1-89
  ANONYMIZER_GLINER_MODEL: /models/gliner-medium-v2.1
  ANONYMIZER_DEFAULT_THRESHOLD: "0.85"
  ANONYMIZER_ML_ENABLED: "true"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
# DeBERTa+GLiNER в RAM ~3GB (по опыту kodikrouter-api RSS 3.2GB). CPU real (не burst).
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 6Gi
# ML cold-load ~30-60с → startupProbe.
probes:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 15
  startup:
    enabled: true
    failureThreshold: 40
    periodSeconds: 5
# Веса (2 .zip ~2.4GB) из Selectel S3 → /models. Образ kodikrouter-api = python+boto3.
# verify=False: Selectel отдаёт Russian Trusted CA (нет в бандле). Стрим на диск, не в RAM.
initContainers:
- name: fetch-ml-weights
  image: cr.yandex/crp7738saq8ngg8ad5tm/kodikrouter-api:latest
  command: ["python", "-c"]
  args:
  - |
    import os, boto3, zipfile, urllib3
    urllib3.disable_warnings()
    s3 = boto3.client("s3",
        endpoint_url="https://" + os.environ["S3_ENDPOINT"],
        aws_access_key_id=os.environ["S3_ACCESS_KEY"],
        aws_secret_access_key=os.environ["S3_SECRET_KEY"],
        region_name=os.environ.get("S3_REGION", "ru-3"), verify=False)
    b = os.environ["S3_BUCKET"]; pfx = "KodikRouter/anonymizer/"
    objs = s3.list_objects_v2(Bucket=b, Prefix=pfx).get("Contents", [])
    zips = [o["Key"] for o in objs if o["Key"].endswith(".zip")]
    print("zips:", zips)
    for k in zips:
        tmp = "/models/_dl.zip"
        print("downloading", k)
        s3.download_file(b, k, tmp)
        zipfile.ZipFile(tmp).extractall("/models")
        os.remove(tmp)
    print("models:", sorted(os.listdir("/models")))
  env:
  - name: S3_ENDPOINT
    valueFrom: {secretKeyRef: {name: kodikdemo-anonymizer-env, key: S3_ENDPOINT}}
  - name: S3_ACCESS_KEY
    valueFrom: {secretKeyRef: {name: kodikdemo-anonymizer-env, key: S3_ACCESS_KEY}}
  - name: S3_SECRET_KEY
    valueFrom: {secretKeyRef: {name: kodikdemo-anonymizer-env, key: S3_SECRET_KEY}}
  - name: S3_REGION
    valueFrom: {secretKeyRef: {name: kodikdemo-anonymizer-env, key: S3_REGION}}
  - name: S3_BUCKET
    valueFrom: {secretKeyRef: {name: kodikdemo-anonymizer-env, key: S3_BUCKET}}
  volumeMounts:
  - {name: ml-weights, mountPath: /models}
volumes:
- name: ml-weights
  emptyDir:
    sizeLimit: 6Gi
volumeMounts:
- {name: ml-weights, mountPath: /models, readOnly: true}
ingress:
  enabled: false
externalSecret:
  enabled: true
  storeName: vault-kv
  storeKind: ClusterSecretStore
  remoteKey: apps/kodikdemo # Vault KV: kv/data/apps/kodikdemo (общий с web)
serviceAccount:
  create: true
