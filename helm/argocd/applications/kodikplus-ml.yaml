apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kodikplus-ml
  namespace: argocd
  # Тег image.tag бампит ArgoCD Image Updater (CR kodik-apps), не аннотации.
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kodikplus
  sources:
    - repoURL: git@github.com:iketrosan-dotcom/vibekodik-infra.git
      targetRevision: gitops
      path: helm/apps/charts/app
      helm:
        releaseName: kodikplus-ml
        valueFiles:
          - $values/helm/apps/kodikplus-ml.values.yaml
    - repoURL: git@github.com:iketrosan-dotcom/vibekodik-infra.git
      targetRevision: gitops
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
