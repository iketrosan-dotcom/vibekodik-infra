# ArgoCD Application: kodik-landing (kodik.ru, Next.js лендинг).
# Миграция Selectel diana → k8s (2026-07-06). Без секретов.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kodik-landing
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kodik-ide
  sources:
    - repoURL: git@github.com:iketrosan-dotcom/vibekodik-infra.git
      targetRevision: gitops
      path: helm/apps/charts/app
      helm:
        releaseName: kodik-landing
        valueFiles:
          - $values/helm/apps/kodik-landing.values.yaml
    - repoURL: git@github.com:iketrosan-dotcom/vibekodik-infra.git
      targetRevision: gitops
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
