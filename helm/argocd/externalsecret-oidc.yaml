# ESO тянет OIDC client-secret ArgoCD из Vault (kv/apps/argocd) → k8s Secret argocd-oidc.
# Label part-of=argocd обязателен: argocd-server читает секреты с этим label по синтаксису
# $argocd-oidc:oidc.keycloak.clientSecret в argocd-cm oidc.config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: oidc.keycloak.clientSecret
      remoteRef:
        key: apps/argocd
        property: oidc_client_secret
