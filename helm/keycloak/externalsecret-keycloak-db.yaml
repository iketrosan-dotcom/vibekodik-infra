# ESO синкает Lockbox-секрет 'keycloak' → k8s Secret keycloak-db в ns keycloak.
# Оператор Keycloak читает username/password из этого Secret (db.usernameSecret/passwordSecret).
#
# Ключи в Lockbox-секрете 'keycloak' (залить через yc lockbox payload add-version):
#   username        = keycloak
#   password        = <ротированный PG-пароль юзера keycloak>
#   admin-username  = admin
#   admin-password  = <сильный пароль админ-консоли Keycloak>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: keycloak-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: e6qsqpgepoi2r4dj5sb3 # Lockbox secret 'keycloak'
        property: username
    - secretKey: password
      remoteRef:
        key: e6qsqpgepoi2r4dj5sb3
        property: password
---
# Bootstrap-админ Keycloak (первый вход в админку). Оператор v2 читает
# spec.bootstrapAdmin из Secret с ключами username/password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: e6qsqpgepoi2r4dj5sb3
        property: admin-username
    - secretKey: password
      remoteRef:
        key: e6qsqpgepoi2r4dj5sb3
        property: admin-password
