# Ingress для Keycloak на sso.kodik.ru. TLS терминируется тут (cert-manager),
# внутрь — HTTP 8080 на сервис оператора (<CR-name>-service = kodik-service).
#
# DNS: A-запись sso.kodik.ru → IP NLB ingress-nginx (Selectel DNS, вручную).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sso.kodik.ru]
      secretName: sso-kodik-ru-tls
  rules:
    - host: sso.kodik.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kodik-service
                port:
                  number: 8080
