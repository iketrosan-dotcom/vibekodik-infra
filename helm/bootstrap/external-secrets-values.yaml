# external-secrets-operator (ESO) — синхронизирует YC Lockbox → k8s Secret.
# Чарт: oci://ghcr.io/external-secrets/charts/external-secrets  (или helm repo external-secrets)
#
# helm upgrade --install external-secrets \
#   oci://ghcr.io/external-secrets/charts/external-secrets \
#   -n external-secrets --create-namespace \
#   -f external-secrets-values.yaml
#
# CRDs ставит сам чарт (installCRDs=true по умолчанию).

installCRDs: true

replicaCount: 1

# webhook + cert-controller для валидации CRD
webhook:
  replicaCount: 1
certController:
  replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

# Системные addon'ы живут на general NG (без taint).
nodeSelector:
  workload: general
