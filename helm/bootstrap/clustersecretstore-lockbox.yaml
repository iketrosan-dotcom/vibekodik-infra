# ClusterSecretStore — мост ESO → YC Lockbox. Один на весь кластер.
#
# ПРЕДУСЛОВИЕ: в ns external-secrets должен лежать Secret с authorized-key.json
# того SA, что создаёт terraform (модуль lockbox, output external_secrets_authorized_key_json):
#
#   terraform output -raw external_secrets_authorized_key_json `
#     > c:\src\kodik\.secrets\external-secrets-key.json
#
#   kubectl -n external-secrets create secret generic yc-lockbox-auth `
#     --from-file=authorized-key=c:\src\kodik\.secrets\external-secrets-key.json
#
# Провайдер называется yandexlockbox. apiVersion — external-secrets.io/v1.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: yc-lockbox
spec:
  provider:
    yandexlockbox:
      auth:
        authorizedKeySecretRef:
          name: yc-lockbox-auth
          key: authorized-key
          # Для ClusterSecretStore namespace ОБЯЗАТЕЛЕН (cluster-scoped ресурс
          # не знает, в каком ns искать Secret с ключом).
          namespace: external-secrets
