#cloud-config

# Cloud-init для VM kodik-ci — self-hosted GitHub Actions runner.
# Stack: git, python 3.12, node 22, docker, fail2ban. Сам runner agent ставится
# отдельно (3 раза — по одному на репо KodikRouterAPI, KodikRouterFront, KodikDetect).
#
# Сеть: private subnet vibekodik-prod-a (10.128.1.0/24), egress через NAT gateway
# (vibekodik-nat-gw). Без публичного IP. SSH только через bastion (relayer-01).
#
# Что НЕ делается:
#   - регистрация runner в GitHub (требует одноразовый registration token)
#   - установка systemd-unit'ов для runner-ов
#   - SSH keypair для ci-deploy (генерируем после первого SSH-входа)

package_update: true
packages:
  - git
  - curl
  - jq
  - build-essential
  - python3-pip
  - python3.12-venv
  - fail2ban
  - ca-certificates
  - gnupg
  - lsb-release
  - htop
  - unzip

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFYSxbBCBt0uuuoYQn2j0fsh2bhNY19YI7gNl3H8WQX4 kristian@vibekodik-20260430

write_files:
  - path: /etc/ssh/sshd_config.d/99-port.conf
    content: |
      Port 5722
    permissions: "0644"

  - path: /etc/fail2ban/jail.d/custom.local
    encoding: base64
    content: W3NzaGRdCmVuYWJsZWQgPSB0cnVlCnBvcnQgICAgPSA1NzIyCm1heHJldHJ5ID0gNQpmaW5kdGltZSA9IDEwbQpiYW50aW1lICA9IDFoCg==
    permissions: "0644"

runcmd:
  # Swap 2 GB (npm/pytest могут жрать память при параллельных деплоях)
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - sh -c 'echo "/swapfile none swap sw 0 0" >> /etc/fstab'

  # Node.js 22 LTS — нужен для frontend builds если runner будет билдить локально
  - sh -c 'curl -fsSL https://deb.nodesource.com/setup_22.x | bash -'
  - apt-get install -y nodejs

  # Docker — для actions/runner некоторые официальные actions требуют docker
  - install -m 0755 -d /etc/apt/keyrings
  - sh -c 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg'
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - sh -c 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker ubuntu

  # Workspace для GitHub Actions runner-ов
  - mkdir -p /opt/actions-runner/api /opt/actions-runner/front /opt/actions-runner/detect
  - chown -R ubuntu:ubuntu /opt/actions-runner

  # fail2ban + ssh restart
  - systemctl enable --now fail2ban
  - systemctl restart ssh
